<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Трек прохождения</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell wide track-shell">
      <header class="topbar">
        <div>
          <h1>Трек прохождения</h1>
          <p>Шаг 3 из 3: загрузите GPX и проверьте прохождение на карте.</p>
        </div>
        <div class="wizard-nav">
          <a class="button" href="/trainings/imports/{{ draft.draft_id }}/map">К карте</a>
          <button class="button primary" type="submit" form="finish-import-form">Завершить импорт</button>
        </div>
      </header>

      <section class="panel form-stack track-upload-panel">
        <form id="track-upload-form" class="upload-row">
          <input name="file" type="file" accept=".gpx,application/gpx+xml,text/xml" required>
          <button class="button" type="submit">Загрузить GPX</button>
        </form>
        <div class="actions">
          {% if draft.track_points %}
            <form method="post" action="/trainings/imports/{{ draft.draft_id }}/track/delete">
              <button class="button" type="submit">Удалить трек</button>
            </form>
          {% endif %}
        </div>
      </section>
      <form id="finish-import-form" method="post" action="/trainings/imports/{{ draft.draft_id }}/finish" hidden></form>

      <section
        id="track-workspace"
        class="track-workspace"
        data-draft-id="{{ draft.draft_id }}"
        data-training-type="{{ draft.training_type or '' }}"
        data-image-url="{{ draft.map_image_url or '' }}"
        data-transform='{{ draft.georef_transform | tojson }}'
        data-course-controls='{{ draft.course_controls | tojson }}'
        data-track-points='{{ draft.track_points | tojson }}'
      >
        <div class="map-pane panel">
          <div class="pane-header">
            <h2>Карта маршрута</h2>
            <span id="track-status" class="muted">Загрузите GPX</span>
          </div>
          <p id="track-splits-status" class="muted track-splits-status">После загрузки GPX здесь появятся точки нарезки по КП.</p>
          <div class="track-image-stage">
            <div id="track-image-viewport" class="track-image-viewport">
              <div id="track-image-content" class="track-image-content">
                {% if draft.map_image_url %}
                  <img id="track-map-image" src="{{ draft.map_image_url }}" alt="Карта тренировки">
                  <svg id="track-image-svg" class="track-image-svg"></svg>
                {% else %}
                  <div class="empty-stage">Нет картинки карты</div>
                {% endif %}
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/splits.js"></script>
    <script src="/static/track.js"></script>
  </body>
</html>
